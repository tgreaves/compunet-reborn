<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compunet Reborn — Web Client (Binding B)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101014; color: #cdd; font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  h1 { font-size: 15px; font-weight: 600; color: #8ab; margin: 4px 0; letter-spacing: .5px; }
  #login { display: flex; gap: 8px; align-items: center; }
  input { background: #1a1a22; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 6px 8px; }
  button { background: #26263a; color: #dde; border: 1px solid #3a3a55; border-radius: 4px;
           padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { background: #33334d; }
  button:disabled { opacity: .4; cursor: default; }
  #screenWrap { padding: 24px; border-radius: 6px; line-height: 0; box-shadow: 0 6px 30px #0008; }
  canvas { image-rendering: pixelated; display: block; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; max-width: 720px; justify-content: center; }
  #status { font: 12px ui-monospace, monospace; color: #7a8; min-height: 16px; }
  /* Partyline: blue message area, green input — the C64 chrome (§8.5), modernised */
  #chat { width: 640px; display: flex; flex-direction: column; gap: 6px; }
  #chatLog { height: 220px; overflow-y: auto; background: #000060; border: 2px solid #0000dd;
             color: #99ff99; font: 13px/1.35 ui-monospace, monospace; padding: 8px;
             white-space: pre-wrap; word-break: break-word; }
  #chatInput { background: #001000; border: 2px solid #00dd00; color: #99ff99;
               font: 13px ui-monospace, monospace; padding: 6px 8px; caret-color: #00dd00; }
  /* Editor (client-side feature, §8.4) */
  #editor { width: 640px; display: flex; flex-direction: column; gap: 8px;
            background: #16161f; border: 1px solid #33334d; border-radius: 6px; padding: 12px; }
  #editorTitle { font-weight: 600; color: #8ab; }
  #editor .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #edBody { background: #0b0b12; color: #cde; border: 1px solid #333; border-radius: 4px;
            font: 13px/1.3 ui-monospace, monospace; padding: 8px; resize: vertical; }
  select { background: #1a1a22; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 6px; }
  .hint { color: #667; font-size: 12px; }
</style>
</head>
<body>
  <h1>◆ COMPUNET REBORN — web client (Binding B / JSON API)</h1>
  <div id="login">
    <input id="host" value="ws://localhost:6404" size="22" title="API base (ws://host:port)">
    <input id="user" value="TEST" size="8" placeholder="user">
    <input id="pass" type="password" value="" size="10" placeholder="password">
    <button id="connect">Connect</button>
  </div>
  <div id="screenWrap"><canvas id="screen" width="640" height="384"></canvas></div>
  <div id="bar"></div>
  <div id="editor" hidden>
    <div id="editorTitle">Compose</div>
    <div class="row">
      <input id="edTitle" placeholder="title (16 chars)" maxlength="16">
      <span id="edContentFields">
        <select id="edKind"><option value="T">T — text</option><option value="P">P — program</option></select>
        <input id="edPrice" type="number" step="0.01" min="0" value="0" title="price" style="width:6em">
        <input id="edLife" type="number" min="0" value="30" title="life (days)" style="width:5em">
      </span>
      <input id="edTo" placeholder="to: ID,ID" hidden>
    </div>
    <textarea id="edBody" rows="10" spellcheck="false"
              placeholder="Page text — 40 columns wide, up to 23 lines."></textarea>
    <div class="row">
      <button id="edSubmit">Submit</button>
      <button id="edCancel">Cancel</button>
      <span class="hint" id="edHint"></span>
    </div>
  </div>

  <div id="chat" hidden>
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="Type a message, or *help for commands — Enter to send" autocomplete="off">
  </div>
  <div id="status">Not connected.</div>
  <div class="hint">Keys: ↑/↓ select · Enter = SHOW · → = DIR · ← = BACK · N = MORE · F = FINISH · C = cycle column</div>
  <script type="module" src="./dist/app.bundle.js"></script>
</body>
</html>
